apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-event-registration-poojitha

spec:
  replicas: 3

  selector:
    matchLabels:
      app: student-event-registration-poojitha

  template:
    metadata:
      labels:
        app: student-event-registration-poojitha

    spec:
      containers:
        - name: student-event-registration-poojitha
          image: kurellapoojitha/event-registrationpooji:v2

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: student-event-service-poojitha

spec:
  type: NodePort

  selector:
    app: student-event-registration-poojitha

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30017
